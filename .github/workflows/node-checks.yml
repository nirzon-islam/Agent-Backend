name: Node.js checks

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Syntax check JavaScript files
        run: |
          find . -path ./node_modules -prune -o -name "*.js" -type f -print0 | xargs -0 -n1 node --check
